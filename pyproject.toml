[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speechio"
version = "0.4.0"
description = "Local realtime speech SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26.4",
    "soundfile>=0.13",
    "av>=18",
    "soxr>=1",
    "httpx>=0.28.1",
    "websockets>=17.2",
    "PyAudio>=0.2.14",
    "webrtcvad-wheels>=2.0.14",
    "onnxruntime>=1.20.1",
    "huggingface-hub>=0.34",
    "pvporcupine>=4.0.3",
    # 此分支只安装 ONNX 推理依赖，不引入 TFLite。
    "private-assistant-openwakeword[onnx]>=0.6",
]

[project.scripts]
asr-install-sherpa-models = "speechio.install_sherpa_models:main"

[project.optional-dependencies]
stt-whisper = ["faster-whisper>=1.2.1"]
stt-nemotron = ["sherpa-onnx>=1.13.4"]
tts-qwen = ["qwen-tts>=0.1.1", "torch>=2.7", "torchaudio>=2.7"]
tts-kokoro = ["kokoro>=0.9.4", "misaki[en,zh]>=0.9.4", "torch>=2.7"]

[dependency-groups]
web = [
    "fastapi>=0.143.5,<0.144",
    "httpx>=0.28.1,<0.29",
    "uvicorn>=0.54.0,<0.55",
    "websockets>=17.2,<18",
    "python-multipart>=0.0.32,<0.1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
]
web-test = [
    { include-group = "web" },
]
dev = [
    "psutil>=7,<8",
    "scipy>=1.15,<2",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["speechio*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
# 内置 Silero v6 检测模型及其许可说明，随 wheel 分发。
speechio = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# sherpa-onnx 1.13.8 的 ARMv7 wheel 不依赖 core，64 位 wheel 则依赖同版本 core。
# 为 uv 的跨平台开发锁补全元数据；不改变发布包的版本范围或 pip 依赖声明。
[[tool.uv.dependency-metadata]]
name = "sherpa-onnx"
version = "1.13.8"
requires-dist = ["sherpa-onnx-core==1.13.8; platform_machine != 'armv7l'"]
