[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-asr"
version = "0.1.0"
description = "Independent local ASR recognition core"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3"]

[project.scripts]
realtime-asr = "realtime_asr.cli.runner:main"
realtime-asr-server = "realtime_asr.server.__main__:main"
realtime-asr-remote = "realtime_asr.client.__main__:main"

[project.optional-dependencies]
whisper = ["faster-whisper==1.2.1", "huggingface-hub>=0.34,<1"]
nemotron = ["sherpa-onnx==1.13.4", "onnxruntime>=1.31,<2", "requests>=2.32,<3"]
audio = ["soundfile>=0.13,<0.14", "soxr>=1,<2"]
vad = ["webrtcvad-wheels==2.0.14", "onnxruntime>=1.31,<2"]
wake-porcupine = ["pvporcupine==4.0.3"]
wake-openwakeword = ["openwakeword==0.6.0", "onnxruntime>=1.31,<2"]
microphone = ["PyAudio==0.2.14", "soxr>=1,<2"]
server = ["fastapi>=0.115,<1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1", "websockets>=15,<17", "soxr>=1,<2"]
client = ["httpx>=0.28,<1", "websocket-client>=1.8,<2"]

[dependency-groups]
dev = ["psutil>=7,<8", "scipy>=1.15,<2", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["realtime_asr*"]
namespaces = false

[tool.setuptools.package-data]
"realtime_asr.server" = ["static/index.html", "static/audio-worklet.js", "static/assets/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
# 唤醒固定使用 ONNX；此版本的 Linux TFLite 依赖没有 Python 3.12 轮子。
exclude-dependencies = [
    { package = { name = "openwakeword", version = "0.6.0" }, dependencies = ["tflite-runtime"] },
]
