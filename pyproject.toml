[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "speechio"
version = "0.1.0"
description = "Local realtime speech SDK"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "faster-whisper==1.2.1",
    "huggingface-hub>=0.34,<1",
    "soundfile>=0.13,<0.14",
    "soxr>=1,<2",
    "PyAudio==0.2.14",
    "webrtcvad-wheels==2.0.14",
    "onnxruntime>=1.31,<2",
]

[project.scripts]
asr-install-sherpa-models = "speechio.install_sherpa_models:main"

[project.optional-dependencies]
nemotron = ["sherpa-onnx==1.13.4", "requests>=2.32,<3"]
wake-porcupine = ["pvporcupine==4.0.3"]
wake-openwakeword = ["openwakeword==0.6.0"]

[dependency-groups]
dev = [
    "psutil>=7,<8",
    "scipy>=1.15,<2",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["speechio*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
# 内置 Silero v6 检测模型及其许可说明，随 wheel 分发。
speechio = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
# 唤醒固定使用 ONNX；此版本的 Linux TFLite 依赖没有 Python 3.12 轮子。
exclude-dependencies = [
    { package = { name = "openwakeword", version = "0.6.0" }, dependencies = ["tflite-runtime"] },
]
