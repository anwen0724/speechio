[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-asr"
version = "0.1.0"
description = "Independent local ASR recognition core"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "faster-whisper==1.2.1",
    "huggingface-hub>=0.34,<1",
    "soundfile>=0.13,<0.14",
    "soxr>=1,<2",
]

[project.scripts]
asr = "realtime_asr.cli.runner:main"
asr-install-sherpa-models = "realtime_asr.core.install_sherpa_models:main"

[project.optional-dependencies]
nemotron = ["sherpa-onnx==1.13.4", "onnxruntime>=1.31,<2", "requests>=2.32,<3"]
vad = ["webrtcvad-wheels==2.0.14", "onnxruntime>=1.31,<2"]
wake-porcupine = ["pvporcupine==4.0.3"]
wake-openwakeword = ["openwakeword==0.6.0", "onnxruntime>=1.31,<2"]
microphone = ["PyAudio==0.2.14", "soxr>=1,<2"]

[dependency-groups]
dev = [
    "psutil>=7,<8",
    "scipy>=1.15,<2",
    "ruff>=0.12",
    # server/client 是仓库内的应用层参考实现，依赖只用于开发和验证，不随库安装。
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
    "websockets>=15,<17",
    "httpx>=0.28,<1",
    "websocket-client>=1.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["realtime_asr*"]
exclude = ["realtime_asr.server*", "realtime_asr.client*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"realtime_asr.cli" = ["config.example.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
# 唤醒固定使用 ONNX；此版本的 Linux TFLite 依赖没有 Python 3.12 轮子。
exclude-dependencies = [
    { package = { name = "openwakeword", version = "0.6.0" }, dependencies = ["tflite-runtime"] },
]
