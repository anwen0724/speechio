[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "speechio"
version = "0.1.0"
description = "Local realtime speech SDK"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2,<3",
    "faster-whisper>=1.2.1,<2",
    "huggingface-hub>=0.34,<1",
    "soundfile>=0.13,<0.15",
    "av>=18,<20",
    "soxr>=1,<2",
    "webrtcvad-wheels>=2.0.14,<3",
    "onnxruntime>=1.20.1,<2",
]

[project.scripts]
asr-install-sherpa-models = "speechio.install_sherpa_models:main"

[project.optional-dependencies]
remote = ["httpx>=0.28.1,<0.29", "websockets>=17.2,<18"]
microphone = ["PyAudio>=0.2.14,<0.3"]
nemotron = ["sherpa-onnx>=1.13.4,<2", "requests>=2.33,<3"]
wake-porcupine = ["pvporcupine>=4.0.3,<5"]
# 第三方分支将 ONNX 与 TFLite 拆为 extras；导入名仍为 openwakeword。
wake-openwakeword = ["private-assistant-openwakeword[onnx]>=0.6,<0.7"]

[dependency-groups]
web = [
    "fastapi>=0.143.5,<0.144",
    "httpx>=0.28.1,<0.29",
    "uvicorn>=0.54.0,<0.55",
    "websockets>=17.2,<18",
    "python-multipart>=0.0.32,<0.1",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
]
web-test = [
    { include-group = "web" },
]
dev = [
    "psutil>=7,<8",
    "scipy>=1.15,<2",
    "ruff>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["speechio*"]
namespaces = false

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
# 内置 Silero v6 检测模型及其许可说明，随 wheel 分发。
speechio = ["assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# sherpa-onnx 1.13.8 的 ARMv7 wheel 不依赖 core，64 位 wheel 则依赖同版本 core。
# 为 uv 的跨平台开发锁补全元数据；不改变发布包的版本范围或 pip 依赖声明。
[[tool.uv.dependency-metadata]]
name = "sherpa-onnx"
version = "1.13.8"
requires-dist = ["sherpa-onnx-core==1.13.8; platform_machine != 'armv7l'"]
