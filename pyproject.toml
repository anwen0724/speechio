[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-asr"
version = "0.1.0"
description = "Independent local ASR recognition core"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2,<3"]

[project.optional-dependencies]
whisper = ["faster-whisper==1.2.1", "huggingface-hub>=0.34,<1"]
nemotron = ["sherpa-onnx==1.13.4", "onnxruntime>=1.31,<2", "requests>=2.32,<3"]

[dependency-groups]
dev = ["psutil>=7,<8", "scipy>=1.15,<2", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["realtime_asr*"]
namespaces = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
