# 本机启动配置。修改后重新启动命令生效。
# 配置内相对路径以本文件目录为基准；命令行参数只覆盖当次运行。
# mic 默认自动分句并启用实时；file 默认手动整段，不启用实时。

[model]
backend = "whisper" # whisper 或 nemotron
model_path = ".runtime/models/whisper-tiny"
device = "cpu" # 需要本机 GPU 时改为 cuda
# device_index = 0

[gpu]
# 仅选择 CUDA 时使用；CPU 会忽略本组配置。
cuda_directory = "C:/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v12.8/bin"
cudnn_folder = ".runtime/cudnn/9.16.0.29"

[recognition]
language = "zh" # 自动判断语言时删除本行
# mode = "auto" # 不填写则保留各命令自己的模式默认值
word_timestamps = false

[microphone]
# device_index = 1 # 通过 asr devices 查询；省略时使用系统默认设备
# sample_rate = 16000 # 省略时由采集器选择设备支持的格式
channels = 1
# chunk_frames = 1024 # 仅本地 mic
# queue_seconds = 5.0 # 仅本地 mic
# duration = 20.0 # 省略时持续采集，Ctrl+C 停止

[input]
# stdin 接收 raw 音频，不含 WAV 文件头。
sample_rate = 16000
channels = 1
sample_type = "int16"

[realtime]
# enabled = true # 不填写则保留 mic／file／remote 各自默认值
stable_text = false
# interval = 0.2 # 本地及服务角色更新间隔，单位秒
# initial_delay = 0.2
# model_path = ".runtime/models/nemotron"
# backend = "nemotron"
# device = "cpu"
dual_realtime = false
acoustic_boundaries = false

[ultrafast]
# 双路宿主需要独立极速模型；客户端再申请双实时，默认不启用。
# model_path = ".runtime/models/nemotron-80ms"
# backend = "nemotron"
# device = "cpu"

[vad]
model_path = ".runtime/models/vad/silero-v6.onnx"
# 下列检测策略用于本地自动输入；服务输入沿用已有协议策略。
webrtc_mode = 3
silero_sensitivity = 0.4
silero_end_detection = false

[segmentation]
# 本地自动输入的高级参数，单位秒。
silence_confirmation = 0.16
post_speech_silence = 0.6
min_recording_duration = 0.5
min_gap = 0.0
pre_roll_duration = 1.0
trim_pre_roll = false
backdate_duration = 0.0

[endpoint]
early_transcription_silence = 0.0
dynamic_silence = false
punctuation_split = false

[candidate]
enabled = false
# model_path = ".runtime/models/whisper-tiny" # 省略时共享主模型
# backend = "whisper"
# device = "cpu"
only = false
kind = "whole" # whole 或 tail
every = 2.0
hint = false
completion_mode = "final" # final 或 candidate
retain_for_correction = false
correct_after_final = false

[wake]
enabled = false
backend = "openwakeword" # openwakeword 或 porcupine
model_paths = [".runtime/models/wake/alexa_v0.1.onnx"]
feature_model_dir = ".runtime/models/wake"
# Porcupine 使用 keywords 或本地 .ppn model_paths；非英语模型可配 model_path=.pv。
# keywords = ["porcupine"]
# model_path = "models/porcupine-language.pv"
# Porcupine 的密钥读取 PICOVOICE_ACCESS_KEY，不在此写密钥。
sensitivity = 0.5
activation_delay = 0.0
speech_timeout = 5.0
trim_duration = 0.1
followup_window = 0.0

[server]
host = "127.0.0.1"
port = 8000
token_env = "REALTIME_ASR_TOKEN"
# ssl_certfile = "secrets/server.crt"
# ssl_keyfile = "secrets/server.key"
# allowed_origins = ["https://asr.example.com"]
# proxy_tls = false
# trusted_proxy_ips = "127.0.0.1"
# 需要调整容量／超时才填写：
# max_sessions = 16
# max_tasks = 32
# max_task_audio_samples = 9600000
# max_audio_seconds = 30.0
# max_pending_units = 8
# max_http_bytes = 16777216
# max_packet_bytes = 1048576
# max_metadata_bytes = 65536
# max_pending_messages = 256
# open_timeout = 10.0
# idle_timeout = 300.0
# body_timeout = 30.0
# drain_timeout = 30.0
# send_timeout = 5.0
# close_timeout = 5.0

[remote]
url = "http://127.0.0.1:8000"
token_env = "REALTIME_ASR_TOKEN"
timeout = 30.0

[output]
format = "text" # text 或 jsonl；不会自动保存正文，保存仍用重定向

[limits]
# 本地输入的容量与等待时间，服务对应参数写在 server 中。
max_audio_seconds = 30.0
drain_timeout = 30.0
close_timeout = 5.0
