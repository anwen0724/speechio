# 从仓库根目录运行。模型名首次使用可能下载；本地目录可启用 local_files_only。
[web]
upload_limit_mb = 100
upload_dir = ".runtime/web-uploads"

[models.whisper-tiny]
model = "tiny"
engine = "whisper"
device = "cpu"
compute_type = "int8"

[models.whisper-base]
model = "base"
engine = "whisper"
device = "cpu"
compute_type = "int8"

# 使用本机模型时，取消注释并填写已安装模型目录。
