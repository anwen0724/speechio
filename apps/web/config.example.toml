# 从仓库根目录运行；先下载模型，再填写已有模型目录。加载时不联网。
[web]
upload_limit_mb = 100
upload_dir = ".runtime/web-uploads"

[models.whisper-tiny]
model_path = ".runtime/models/whisper-tiny"
engine = "whisper"
device = "cpu"
compute_type = "int8"

[models.whisper-base]
model_path = ".runtime/models/whisper-base"
engine = "whisper"
device = "cpu"
compute_type = "int8"

