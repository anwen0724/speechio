# 从仓库根目录运行；本地模型填写已有目录，云端模型填写服务商与环境变量名称。
[web]
upload_limit_mb = 1024 # 按 MiB 计算，1024 MiB = 1 GiB
upload_dir = ".runtime/web-uploads"
voices_dir = "apps/web/data/voices" # 持久保存克隆音色，重启不清除

[models.whisper-tiny]
model_path = ".runtime/models/whisper-tiny"
engine = "whisper"
device = "cpu"
compute_type = "int8"

[models.whisper-base]
model_path = ".runtime/models/whisper-base"
engine = "whisper"
device = "cpu"
compute_type = "int8"

# 使用本机模型时，取消注释并填写已安装模型目录。
# [models.nemotron]
# model_path = ".runtime/models/nemotron"
# engine = "nemotron"
# device = "cpu"

# 唤醒项只有配置后才会在页面出现。文件路径与密钥不会返回浏览器。
# [wakes.hey-jarvis]
# backend = "openwakeword"
# model_paths = ["/absolute/path/hey_jarvis_v0.1.onnx"]
# feature_model_dir = "/absolute/path/openwakeword"
#
# [wakes.porcupine]
# backend = "porcupine"
# keywords = ["porcupine"]
# access_key = "填写本机 AccessKey，不要提交该文件"

# 优先使用 apikey；留空时按 api_key_env 读取进程环境，其次读取 apps/web/.env。
[models."qwen-audio-3.1-asr-flash"]
source = "remote"
provider = "bailian"
model = "qwen-audio-3.1-asr-flash"
apikey = ""
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 30
# 如需业务空间专属域名或其他地域，填写 HTTPS 根地址（不含 API 路径）。
# base_url = "https://你的WorkspaceId.cn-beijing.maas.aliyuncs.com"

[models."qwen-audio-3.1-asr-flash-streaming"]
source = "remote"
provider = "bailian"
model = "qwen-audio-3.1-asr-flash-streaming"
apikey = ""
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 30
# base_url = "https://你的WorkspaceId.cn-beijing.maas.aliyuncs.com"

# 只用于文件转写；浏览器上传本地文件，由核心包提交云端长音频任务。
[models."qwen-audio-3.1-asr-flash-filetrans"]
source = "remote"
provider = "bailian"
model = "qwen-audio-3.1-asr-flash-filetrans"
apikey = ""
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 30
task_timeout_seconds = 3600 # 云端任务最多等待一小时，与音频时长上限不同
# base_url = "https://你的WorkspaceId.cn-beijing.maas.aliyuncs.com"

# 文字转语音；密钥沿用同名环境变量，或在本条目直接填写 apikey。
[models."qwen-audio-3.1-tts-flash"]
task = "synthesis"
source = "remote"
provider = "bailian"
model = "qwen-audio-3.1-tts-flash"
apikey = ""
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 30
max_buffer_seconds = 10
voices = ["yuxiaoyun_v3.1", "Emily_v3.1"] # 建议列表；页面也可直接输入其他音色 ID。

[models."qwen-audio-3.1-tts-flash".synthesis]
voice = "yuxiaoyun_v3.1"
speed = 1.0
# language = "zh" # 不填交给模型决定；英文填写 en。
# instruction = "自然、清晰地朗读"
# sample_rate = 24000 # 不填使用核心适配器声明的默认值。

# 本地 Kokoro：先准备模型目录，并安装 speechio 的 tts-kokoro 可选依赖。
# 音色列表由 Web 读取 model_path/voices/*.pt，无需手写 voices 名单。
# [models."kokoro-v1.1-zh"]
# task = "synthesis"
# adapter = "kokoro"
# model_path = ".runtime/models/kokoro-v1.1-zh"
# device = "cpu" # 页面可为本次合成选择 gpu；需要 GPU 版 PyTorch。
# compute_type = "float32"
#
# [models."kokoro-v1.1-zh".synthesis]
# voice = "zf_001"
# speed = 1.0
# 不指定 language 时，核心适配器根据音色选择中文或英文。

# 本地 Qwen Base：先准备模型并安装 speechio[tts-qwen]。
# 两个版本分别管理克隆音色；没有预设音色，先克隆或直接上传参考录音。
# 不填 compute_type，由核心包按设备选择：GPU 使用 bfloat16，CPU 使用 float32。
# [models."qwen3-tts-0.6b-base"]
# task = "synthesis"
# adapter = "qwen_tts"
# model_path = ".runtime/models/qwen3-tts-0.6b-base"
# device = "gpu" # 页面可为本次克隆或合成切换 cpu / gpu。
#
# [models."qwen3-tts-1.7b-base"]
# task = "synthesis"
# adapter = "qwen_tts"
# model_path = ".runtime/models/qwen3-tts-1.7b-base"
# device = "gpu"
