# 从仓库根目录运行；本地模型填写已有目录，云端模型填写服务商与环境变量名称。
[web]
upload_limit_mb = 100
upload_dir = ".runtime/web-uploads"

[models.whisper-tiny]
model_path = ".runtime/models/whisper-tiny"
engine = "whisper"
device = "cpu"
compute_type = "int8"

[models.whisper-base]
model_path = ".runtime/models/whisper-base"
engine = "whisper"
device = "cpu"
compute_type = "int8"

# 使用本机模型时，取消注释并填写已安装模型目录。
# [models.nemotron]
# model_path = ".runtime/models/nemotron"
# engine = "nemotron"
# device = "cpu"

# 唤醒项只有配置后才会在页面出现。文件路径与密钥不会返回浏览器。
# [wakes.hey-jarvis]
# backend = "openwakeword"
# model_paths = ["/absolute/path/hey_jarvis_v0.1.onnx"]
# feature_model_dir = "/absolute/path/openwakeword"
#
# [wakes.porcupine]
# backend = "porcupine"
# keywords = ["porcupine"]
# access_key = "填写本机 AccessKey，不要提交该文件"

# 优先使用 apikey；留空时按 api_key_env 读取进程环境，其次读取 apps/web/.env。
[models."qwen-audio-3.1-asr-flash"]
source = "remote"
provider = "bailian"
model = "qwen-audio-3.1-asr-flash"
apikey = ""
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 30
# 如需业务空间专属域名或其他地域，填写 HTTPS 根地址（不含 API 路径）。
# base_url = "https://你的WorkspaceId.cn-beijing.maas.aliyuncs.com"

[models."qwen-audio-3.1-asr-flash-streaming"]
source = "remote"
provider = "bailian"
model = "qwen-audio-3.1-asr-flash-streaming"
apikey = ""
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 30
# base_url = "https://你的WorkspaceId.cn-beijing.maas.aliyuncs.com"
